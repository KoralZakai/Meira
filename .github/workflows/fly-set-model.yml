name: Fly Set Model
on:
  workflow_dispatch:
    inputs:
      model:
        description: NEBIUS_MODEL value
        required: true
        default: Qwen/Qwen3-235B-A22B-Instruct-2507
jobs:
  set-model:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl secrets set NEBIUS_MODEL="${{ inputs.model }}" -a lumi-whatsapp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
