# Set any Fly secret without a local flyctl.
#
# fly-set-model.yml can only ever set NEBIUS_MODEL. This is the general form,
# used for ADMIN_TOKEN and anything else that comes later.
#
# The value is typed into the workflow-dispatch form, so it lands in the run's
# inputs — GitHub masks registered secrets in logs, not dispatch inputs. Rotate
# anything set this way if the run log is ever shared.
name: Fly Set Secret
on:
  workflow_dispatch:
    inputs:
      name:
        description: Secret name (e.g. ADMIN_TOKEN)
        required: true
      value:
        description: Secret value
        required: true
jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set the secret
        run: flyctl secrets set "${SECRET_NAME}=${SECRET_VALUE}" -a lumi-whatsapp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Via env, not string interpolation: a value containing quotes or $
          # would otherwise break out of the command.
          SECRET_NAME: ${{ inputs.name }}
          SECRET_VALUE: ${{ inputs.value }}
